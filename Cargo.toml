[package]
name = "bwa-mem2-pure-rs"
version = "0.1.0"
edition = "2021"
autobins = false
description = "Faithful Rust translation of bwa-mem2 for Burrows-Wheeler based sequence alignment"
readme = "README.md"
repository = "https://github.com/henriksson-lab/bwa-mem2-rs"
license = "MIT"
keywords = ["bioinformatics", "alignment", "bwa", "sequencing"]
categories = ["science"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/src/lib.rs",
    "/src/mem_api.rs",
    "/src/output.rs",
    "/src/support.rs",
    "/src/bin/bwa-mem2-rs.rs",
    "/src/generated/**",
    "/scripts/benchmark-real-data.sh",
    "/scripts/conformance-bwa.sh",
    "/scripts/conformance-real-data-matrix.sh",
    "/scripts/download-real-world-fixtures.py",
    "/scripts/regression-simd16-a5.sh",
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "bwa-mem2-rs"
path = "src/bin/bwa-mem2-rs.rs"

[[bin]]
name = "dump-pe-batch-read"
path = "src/bin/dump-pe-batch-read.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
cpu-time = "1.0"
flate2 = "1"
libc = "0.2"
rayon = "1.10"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
